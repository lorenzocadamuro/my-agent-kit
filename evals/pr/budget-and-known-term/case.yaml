schema_version: "1"
name: budget-and-known-term
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    /my:pr:study Usa ./kit-data come data root e salva la pagina come kit-data/study/page.md. Non c'è accesso a GitHub: ecco la review di "dana" sulla PR acme/orders#42 (CHANGES_REQUESTED), incollata qui.
    
    1. (blocking) `submit_order` retries the payment call on timeout, but the retry is not idempotent: a slow success followed by a retry charges the customer twice. Pass an idempotency key.
    2. (blocking) The order is marked `paid` before the payment provider confirms. If the worker restarts in between, we ship unpaid orders.
    3. You added a second `format_price` helper; `money.format` already does this. Please reuse it.
    4. The new `OrderStatus.PENDING_REVIEW` state has no transition out of it in `transition()`; what moves it forward?
    5. nit: `tmp` is not a great variable name.
    6. The test `test_submit_order_retries` builds an order already marked paid, so it would pass even without the fix.
    7. Can we put the new behaviour behind the `orders_v2` flag so we can roll back?
    8. Nice cleanup of the logging, thanks!
