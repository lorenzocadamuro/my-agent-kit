schema_version: "1"
name: review-judges-pr-as-is
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:pr:review Nessun accesso a GitHub: la PR è descritta in ./pr.md (repository acme/pay, branch partial-refunds), con i suoi commit e i thread di review; il codice alla testa è in ./payments e ./tests. Io sono @lia. Modalità local: niente su GitHub. Data root ./kit-data, salva la review in ./review.md. Sono già d'accordo con l'analisi: scrivi anche le bozze in inglese, senza aspettare.
