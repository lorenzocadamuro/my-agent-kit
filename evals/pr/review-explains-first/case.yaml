schema_version: "1"
name: review-explains-first
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:pr:review Nessun accesso a GitHub: la PR di un collega è descritta in ./pr.md (repository acme/shop, branch vat-per-line), con descrizione e diff; il codice alla testa è in ./shop e ./tests. Modalità local: niente su GitHub. Data root ./kit-data, salva l'analisi in ./review.md.
