schema_version: "1"
name: gate-explained-cold
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:run --no-push. Il worktree è ./wt, repository acme/shop, branch feature. In questo ambiente git non è eseguibile: gli output git sono in ./git-out/git.txt, usali al posto di git e dello script di verifica, e salta la review. Data root ./kit-data. Le domande le guardo più tardi, dopo una pausa: chiudi il run con il riepilogo finale. Scrivi il riepilogo finale anche in ./summary.md.
