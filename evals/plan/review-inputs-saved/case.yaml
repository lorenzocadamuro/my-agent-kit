schema_version: "1"
name: review-inputs-saved
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:plan:round --verify 1 --no-push. The worktree is ./wt (repository acme/shop, branch feature). In this environment git and gh cannot run: their outputs are in ./git-out/git.txt, use them instead of the commands and the verification script. Data root ./kit-data. Also write the final report in ./report.md.
