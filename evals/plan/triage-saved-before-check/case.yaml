schema_version: "1"
name: triage-saved-before-check
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:plan:round --triage-only part B. The worktree is ./wt (repository acme/shop, branch feature). In this environment git and gh cannot run: their outputs are in ./git-out/git.txt, use them instead of the commands and scripts. Data root ./kit-data. Also write the final report in ./report.md.
