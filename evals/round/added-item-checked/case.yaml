schema_version: "1"
name: added-item-checked
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:round --no-push. Il round 2 è in corso: l'executor ha finito gli item 1 e 2 e la verifica non è ancora partita. Aggiungi al round 2 anche questo punto: in export_csv la colonna `total` diventa `total_eur`, così finance capisce la valuta. È una riga: fallo tu al volo, senza executor, e poi fermati; la verifica la lancio io con --verify 2. Il worktree è ./wt (repository acme/shop, branch feature). In questo ambiente git e gh non sono eseguibili: gli output sono in ./git-out/git.txt, usali al posto dei comandi e degli script; i commit non si possono fare, lascia le modifiche nel working tree. Data root ./kit-data. Scrivi il report finale anche in ./report.md.
