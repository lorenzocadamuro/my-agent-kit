schema_version: "1"
name: reply-unslopped
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:comments No GitHub access: the review is in ./comments.md, the code at the head in ./app and the PR's plan in ./plan.md. Data root ./kit-data. Save the triage in ./triage.md, and the reply draft alone, nothing else, in ./reply.md. Do not post anything.
