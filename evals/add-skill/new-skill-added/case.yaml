schema_version: "1"
name: new-skill-added
context:
  scaffold_script: setup.sh
execution:
  max_turns: 70
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    /my:add-skill — it belongs in the `pr` area. Use ./kit-data as the data root for this test. The kit worktree is already created at ./kit, from origin/main; git and claude do not run here.

    ---
    name: todo-sweep
    description: "List the TODO and FIXME comments that the current branch adds, each with its file and line, so none ships by accident."
    when: "\"todo sweep\", \"which TODOs did I add\", before opening a pull request"
    ---

    # TODO sweep

    1. Diff the branch against its base (`git diff origin/main...HEAD`).
    2. Keep the added lines that hold TODO, FIXME or XXX.
    3. List each with its file and line number, grouped by file.
    4. If there are none, say so in one line.
