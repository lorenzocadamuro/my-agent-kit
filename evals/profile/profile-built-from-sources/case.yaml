schema_version: "1"
name: profile-built-from-sources
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: |
    /my:profile for the repository in ./repo (acme/shop). Data root ./kit-data. In this environment git and gh do not run: their outputs are in ./git-out/git.txt. I am not here to answer: write the profile to ./kit-data/projects/acme-shop.md now, and put your questions for me at the end of your reply.
