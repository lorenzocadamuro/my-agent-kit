schema_version: "1"
name: review-keeps-study-private
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:review Nessun accesso a GitHub: la PR è descritta in ./pr.md (repository acme/pay, branch review-9) e il codice è in ./payments. Modalità local: niente su GitHub. Data root ./kit-data, salva la review in ./review.md. Non serve aspettare il mio accordo sull'analisi: scrivi anche le bozze. Copia anche in ./drafts.md, parola per parola, il testo che verrebbe pubblicato: i commenti inline e il riepilogo della review.
