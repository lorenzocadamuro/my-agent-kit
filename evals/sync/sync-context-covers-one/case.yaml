schema_version: "1"
name: sync-context-covers-one
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:sync --no-push — per i totali tieni il tax_rate di main e togli il nostro sconto; per gli ordini, attento a non rompere l'API. Lavora nel worktree ./wt (branch feature). In questo ambiente git non è eseguibile: gli output dei comandi git sono già pronti in ./git-out/ (preflight, merge-tree, commit di main, e per ogni file in conflitto le versioni base/ours/theirs). Usa quelli al posto di git. Nessun accesso a GitHub. Data root ./kit-data. Scrivi in ./decision.md una riga per ogni file in conflitto (classe e risoluzione); se devi fermarti per una decisione, scrivi lì anche le opzioni e fermati.
