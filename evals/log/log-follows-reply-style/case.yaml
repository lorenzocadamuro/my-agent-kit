schema_version: "1"
name: log-follows-reply-style
context:
  scaffold_script: setup.sh
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  append_system_prompt: |
    Reply form: write every chat reply in prose. Never use Markdown tables, bullet lists, headers or emoji in a reply. A code block is allowed only for text the reader must copy.
  prompt: |
    /my:log with ./kit-data as the data root for this test.
