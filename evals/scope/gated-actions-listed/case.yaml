execution:
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:scope --dry-run Il ticket è in ./ticket.md, il profilo del progetto in ./kit-data/projects/none-work.md. Data root ./kit-data, salva il piano in ./plan.md. Non posso rispondere alle domande ora: prendi le raccomandate. Non c'è un repository git: pianifica dai file presenti. Alla fine mostrami il riepilogo per l'approvazione.
