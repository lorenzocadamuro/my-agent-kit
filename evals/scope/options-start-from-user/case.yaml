schema_version: "1"
name: options-start-from-user
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:scope --dry-run Il ticket è in ./ticket.md, l'ho scritto io. Data root ./kit-data, salva il piano in ./plan.md. Non posso rispondere alle domande ora: scrivi in ./questions.md le domande che mi faresti, ciascuna con le opzioni e la raccomandazione, poi continua con le raccomandate. Non c'è un repository git: pianifica dai file presenti.
