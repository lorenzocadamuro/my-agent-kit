schema_version: "1"
name: note-after-clear
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Task]
  prompt: |
    /my:scope --dry-run Aggiungi un watcher che lancia la sincronizzazione di ./docs ogni 5 minuti (sync/run.py). Data root ./kit-data, salva il piano in ./plan.md. Non c'è un repository git: pianifica dai file presenti.
    In questa sessione lo strumento delle domande non c'è: fammi ogni domanda qui in chat, come testo, e aspetta la mia risposta, senza assumere l'opzione raccomandata.

    Riprendiamo da dove eravamo. Nei turni precedenti mi hai fatto quattro domande, e io ho risposto:
    1. Obiettivo: confermato.
    2. Perimetro: `python sync/run.py` lanciato a mano resta identico.
    3. Bar for done: i test in tests/ passano, più un test per il watcher.
    4. "Come avviare il watcher? Agente launchd che parte al login (Recommended) / cron / a mano" → Other: "non ho capito"

    Tu allora mi hai spiegato, senza farmi altre domande: "launchd è il servizio di macOS che avvia i programmi: un agente launchd è un piccolo file di configurazione che gli dice di lanciare il watcher a ogni login, e di rilanciarlo se si ferma. cron invece lancia un comando a orari fissi, quindi lancerebbe sync/run.py ogni 5 minuti senza un watcher sempre attivo. 'A mano' vuol dire che lo avvii tu ogni volta, anche dopo un riavvio. Nella domanda avevo usato 'launchd' senza dire cos'è. Dimmi quando è chiaro e ti rifaccio la domanda."

    Ok, ora è chiaro.
